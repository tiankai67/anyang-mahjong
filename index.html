<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安阳麻将 - 在线组局</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 大厅视图 ===== -->
<div id="lobbyView">
  <div class="lobby-title">安阳麻将</div>
  <div class="lobby-subtitle">互报互飞 · 河南安阳地方麻将</div>
  
  <div class="lobby-card">
    <div class="lobby-section">
      <h3>创建房间</h3>
      <div class="input-group">
        <input type="text" id="playerNameInput" placeholder="输入你的昵称" maxlength="12">
      </div>
      <div class="input-group">
        <select id="zuiziSelect">
          <option value="10">10分zuizi</option>
          <option value="20">20分zuizi</option>
          <option value="50">50分zuizi</option>
          <option value="100">100分zuizi</option>
        </select>
        <button class="btn btn-primary" onclick="createRoom()">创建房间</button>
      </div>
    </div>

    <div class="lobby-section">
      <h3>加入房间</h3>
      <div class="input-group">
        <input type="text" id="joinRoomId" placeholder="输入房间号">
        <button class="btn btn-success" onclick="joinRoom()">加入</button>
      </div>
    </div>

    <div class="lobby-section">
      <h3>开放房间</h3>
      <div class="room-list" id="roomList">
        <div style="color:#666; font-size:13px; text-align:center; padding:20px;">暂无开放房间</div>
      </div>
    </div>

    <div class="lobby-section">
      <h3>规则速览</h3>
      <div style="font-size:12px; color:#999; line-height:1.8;">
        · 4人对局，136张牌+1张花牌(财神)<br>
        · 不可吃牌，可碰可杠<br>
        · 顶张听牌：摸到替代牌才能报听<br>
        · 庄家基础分50，闲家10，自摸翻倍<br>
        · 边、卡、吊额外加zuizi<br>
        · 点胡只能胡报听过的玩家
      </div>
      <button class="btn btn-primary" style="margin-top:12px; width:100%;" onclick="location.href='rules.html'">📖 查看完整游戏规则</button>
    </div>
  </div>
</div>

<!-- ===== 游戏视图 ===== -->
<div id="gameView">
  <!-- 顶部信息栏 -->
  <div class="top-bar">
    <div class="room-info">
      <span>房间号: <span class="gold" id="displayRoomId">--</span></span>
      <span>zuizi: <span class="gold" id="displayZuizi">10</span>分</span>
      <span id="displayRound">第1盘</span>
    </div>
    <div class="round-info">
      <span id="displayPhase">等待中</span>
    </div>
    <div class="audio-toggles">
      <button id="sfxToggle" class="btn-icon" onclick="toggleSfx()" title="音效开关">🔊</button>
      <button id="voiceToggle" class="btn-icon" onclick="toggleVoice()" title="报牌语音开关">🗣</button>
      <button id="bgmToggle" class="btn-icon" onclick="toggleBgm()" title="背景音乐开关">🎵</button>
      <span class="bgm-picker" id="bgmPicker" title="切换背景音乐">
        <button class="btn-icon" onclick="cycleBgm(-1)" title="上一首">⏮</button>
        <span id="bgmName" class="bgm-name" title="点击切换开关" onclick="toggleBgm()">曲目1</span>
        <button class="btn-icon" onclick="cycleBgm(1)" title="下一首">⏭</button>
        <button id="bgmModeBtn" class="btn-icon" onclick="toggleBgmMode()" title="播放模式：顺序循环（三首播完再循环）">🔁</button>
      </span>
      <a id="rulesToggle" class="btn-icon" href="rules.html" title="游戏规则" style="text-decoration:none; display:inline-flex; align-items:center;">📖</a>
    </div>
    <button class="btn btn-leave" onclick="leaveRoom()">离开</button>
  </div>

  <!-- 桌面缩放容器 -->
  <div class="table-wrap">
    <!-- 麻将桌（三家在桌内，随桌面整体缩放） -->
    <div class="mahjong-table">
      <div class="table-center">
        <div class="remaining" id="remainingTiles">137</div>
        <div class="label">余牌</div>
        <div class="center-discard" id="centerDiscard"></div>
      </div>

      <!-- 对家（上） -->
      <div class="player-area player-top" id="playerTop">
        <div class="player-info" id="infoTop"></div>
        <div class="opp-hand" id="handTop"></div>
        <div class="meld-area" id="meldTop"></div>
        <div class="discard-area" id="discardTop"></div>
      </div>

      <!-- 左家 -->
      <div class="player-area player-left" id="playerLeft">
        <div class="player-info" id="infoLeft"></div>
        <div class="opp-hand" id="handLeft"></div>
        <div class="meld-area" id="meldLeft"></div>
        <div class="discard-area" id="discardLeft"></div>
      </div>

      <!-- 右家 -->
      <div class="player-area player-right" id="playerRight">
        <div class="player-info" id="infoRight"></div>
        <div class="opp-hand" id="handRight"></div>
        <div class="meld-area" id="meldRight"></div>
        <div class="discard-area" id="discardRight"></div>
      </div>
    </div>
  </div>

  <!-- 自己（下）：独立底部面板，不随桌面缩放，保证清晰可点 -->
  <div class="bottom-panel">
    <div class="player-info" id="infoBottom"></div>
    <div class="meld-area" id="meldBottom"></div>
    <div class="hand-area" id="handArea"></div>
  </div>

  <!-- 操作按钮 -->
  <div class="action-bar" id="actionBar" style="display:none;"></div>

  <!-- 常驻“再来一局”按钮（一局结束后显示） -->
  <button class="btn btn-primary float-newround" id="newRoundFloat" onclick="startNewRound()" style="display:none;">再来一局</button>

  <!-- 一局结束“亮牌”后的非阻塞结算条：不遮挡桌面，可点“查看结算”看明细 -->
  <div id="resultBar" style="display:none;">
    <span id="resultBarText"></span>
    <button class="btn btn-sm" onclick="openResultModal()">查看结算</button>
  </div>

  <!-- 准备区域 -->
  <div class="ready-area" id="readyArea" style="display:none;">
    <button class="btn btn-primary ready-btn" id="readyBtn" onclick="toggleReady()">准备</button>
    <button class="btn ready-btn" id="addAiBtn" onclick="addAI()" style="margin-left:10px; display:none;">添加电脑</button>
    <div class="waiting-text" id="waitingText"></div>
  </div>

  <!-- 聊天 -->
  <div class="chat-panel" id="chatPanel" style="display:none;">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="发消息..." maxlength="50" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<!-- ===== 弹窗 ===== -->
<!-- 听牌选择弹窗 -->
<div class="modal-overlay" id="tingModal">
  <div class="modal">
    <h2>选择报听</h2>
    <div class="modal-body">
      <p style="margin-bottom:10px;">选择要打出的牌（顶张报听）：</p>
      <div class="ting-options" id="tingOptions"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('tingModal')">取消</button>
    </div>
  </div>
</div>

<!-- 暗杠选择弹窗 -->
<div class="modal-overlay" id="anGangModal">
  <div class="modal">
    <h2>选择暗杠</h2>
    <div class="modal-body">
      <div class="ting-options" id="anGangOptions"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('anGangModal')">取消</button>
    </div>
  </div>
</div>

<!-- 游戏结果弹窗 -->
<div class="modal-overlay" id="resultModal">
  <div class="modal result-modal">
    <h2 id="resultTitle">游戏结束</h2>
    <div class="winner" id="resultWinner"></div>
    <div class="result-detail" id="resultDetail"></div>
    <table class="result-table" id="resultTable"></table>
    <div class="modal-actions">
      <button class="btn btn-primary" id="newRoundBtn" onclick="startNewRound()" style="display:none;">开始新盘</button>
      <button class="btn" onclick="closeModal('resultModal')">关闭</button>
    </div>
  </div>
</div>

<!--
  socket.io 只有在 Node 服务端运行时才存在。
  部署到 GitHub Pages 等纯静态环境时它会 404，onerror 触发后自动切换到单机模式。
-->
<script src="socket.io/socket.io.js" onerror="window.__NO_SERVER__=true"></script>
<script src="js/engine.js"></script>
<script src="js/solo.js"></script>
<script src="js/app.js"></script>
<script>
  // 单机模式下调整大厅文案，隐藏无意义的联机入口
  if (window.__SOLO_MODE__) {
    document.querySelector('.lobby-subtitle').textContent = '互报互飞 · 河南安阳地方麻将（单机版 · 3 个 AI 陪玩）';
    var sections = document.querySelectorAll('.lobby-section');
    for (var i = 0; i < sections.length; i++) {
      var h = sections[i].querySelector('h3');
      if (!h) continue;
      if (h.textContent.indexOf('加入房间') >= 0 || h.textContent.indexOf('开放房间') >= 0) {
        sections[i].style.display = 'none';
      } else if (h.textContent.indexOf('创建房间') >= 0) {
        h.textContent = '开始游戏';
        var btn = sections[i].querySelector('button');
        if (btn) btn.textContent = '开始对局';
      }
    }
  }
</script>

<!-- 悬停牌名提示框 -->
<div id="tileTooltip" class="tile-tooltip"></div>
<!-- 掷骰子定庄动画覆盖层 -->
<div id="diceOverlay" class="dice-overlay">
  <div class="dice-panel">
    <div class="dice-title">🎲 掷骰子定庄</div>
    <div id="dicePlayers" class="dice-players"></div>
    <div id="diceResult" class="dice-result"></div>
    <button id="diceRollBtn" class="btn-dice-roll" onclick="rollDiceNow()">🎲 开始掷骰</button>
  </div>
</div>
</body>
</html>

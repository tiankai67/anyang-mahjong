name: Deploy to GitHub Pages

# 把 public/ 目录发布为 GitHub Pages 静态站点（单机版）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验静态资源完整性
        run: |
          test -f public/index.html
          test -f public/js/engine.js
          test -f public/js/solo.js
          test -f public/js/app.js
          test -f public/css/style.css
          echo "牌面 SVG 数量: $(ls public/tiles | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行引擎测试
        run: |
          node test-engine.js 100
          node test-solo.js

      - name: 禁用 Jekyll 处理
        run: touch public/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
